name: Frontend CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env: {NEXT_PUBLIC_API_BASE_URL: "https://tokenwatch-backend.vercel.app", NEXT_PUBLIC_SITE_URL: "https://tokenwatch-frontend.vercel.app"}
      - run: npm audit --audit-level=high
